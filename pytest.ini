[pytest]
testpaths = backend/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -q
markers =
    tier0: 冒烟档（~5s，backend 全模块导入 + 核心纯函数）
    tier1: 快速单测档（~20s，默认档；新测试文件自动落入）
    tier2: 标准门禁档（~30s，+中速文件与顶层语料基线）
    tier3: pytest 全量档（~110s，+慢速重试链路）
    tier4: 全仓档（T3 + 前端 vitest，由 scripts/run_tests.py 编排）
